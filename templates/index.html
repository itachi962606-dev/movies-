<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoviesHub</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body>
<header><a class="logo" href="/"><img class="logo-image home-logo-image" src="{{ url_for('static', filename='images/logo.png') }}" alt="MoviesHub Logo"><span class="brand-name">Movies<span>Hub</span></span></a>
<div class="filters">
<input id="search" type="search" placeholder="Search movies...">
<select id="genre"></select><select id="language"></select></div>
<a class="bell" id="bell" href="/notifications" title="Notifications" aria-label="Notifications">🔔<span class="dot" id="dot" hidden></span></a></header>
<main>
<nav class="tabs"><a class="tab" id="tab-tamil" href="/?tab=tamil">Tamil Movies</a><a class="tab" id="tab-international" href="/?tab=international">International Movies</a><a class="tab" href="/notifications">Notifications</a><a class="tab" href="/watchlist">Watchlist</a></nav>
<p id="msg" class="msg">Loading...</p><section id="grid" class="grid"></section></main>
<footer>International data provided by TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>
<script src="{{ url_for('static', filename='js/movies.js') }}"></script><script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body></html>
